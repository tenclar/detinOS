services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: detinos_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-detinos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detinos_password_secure_123}
      POSTGRES_DB: ${POSTGRES_DB:-detinos_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - detinos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-detinos_user} -d ${POSTGRES_DB:-detinos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: detinos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - detinos_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Fastify Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detinos_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://detinos_user:detinos_password_secure_123@db:5432/detinos_db?schema=public}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_detinos_2026}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - detinos_network

  # 4. React Frontend SPA + Nginx Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: detinos_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - detinos_network

volumes:
  postgres_data:
  redis_data:

networks:
  detinos_network:
    driver: bridge
