services:

  # 1. Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: detinos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - digital_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Fastify Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: detinos_backend:latest
    container_name: detinos_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      HOST: ${HOST}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-posrgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - redis
    networks:
      - digital_network

  # 3. React Frontend SPA + Nginx Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: detinos_frontend:latest
    container_name: detinos_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8050}:80"
    depends_on:
      - backend
    networks:
      - digital_network

volumes:
  redis_data:

networks:
  digital_network:
    external: true
